[versions]
# Core
kotlin = "2.3.0" # 2.3.20+ is in Alpha
javalin = "6.7.0" # 7.0.0 is in Alpha
slf4j = "2.0.17" # 2.1.0 is in Alpha
jackson = "2.17.2" # 3.0.0 DataType is not stable yet

# Utils
gson = "2.13.2"
fastutil = "8.5.18"
annotations = "26.0.2-1"
commons-lang3 = "3.20.0"
dotenv-java = "3.2.0"

# DB
mysql = "9.5.0"

# Plugins
spotless = "8.1.0"
license = "0.16.1"
graalvm-buildtools-native = "0.11.3"

# Testing
junit = "5.11.4" # 5.12.x+ has issues
javalin-testtools = "6.7.0" # 7.0.0 is in Alpha

[libraries]
# Kotlin
kotlin-stdlib = { module = "org.jetbrains.kotlin:kotlin-stdlib", version.ref = "kotlin" }
kotlin-reflect = { module = "org.jetbrains.kotlin:kotlin-reflect", version.ref = "kotlin" }

# Javalin
javalin = { module = "io.javalin:javalin", version.ref = "javalin" }
javalin-testtools = { module = "io.javalin:javalin-testtools", version.ref = "javalin-testtools" }

# Logging
slf4j-simple = { module = "org.slf4j:slf4j-simple", version.ref = "slf4j" }

# JSON & Serialization
jackson = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-datatype-jsr310 = { module = "com.fasterxml.jackson.datatype:jackson-datatype-jsr310", version.ref = "jackson" }
gson = { module = "com.google.code.gson:gson", version.ref = "gson" }

# Utils
fastutil = { module = "it.unimi.dsi:fastutil", version.ref = "fastutil" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
dotenv-java = { module = "io.github.cdimascio:dotenv-java", version.ref = "dotenv-java" }
annotations = { module = "org.jetbrains:annotations", version.ref = "annotations" }

# DB
mysql = { module = "com.mysql:mysql-connector-j", version.ref = "mysql" }

# Testing (JUnit Jupiter suite)
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-api = { module = "org.junit.jupiter:junit-jupiter-api", version.ref = "junit" }
junit-engine = { module = "org.junit.jupiter:junit-jupiter-engine", version.ref = "junit" }
junit-params = { module = "org.junit.jupiter:junit-jupiter-params", version.ref = "junit" }

# You may want this for mocking
mockito-core = { module = "org.mockito:mockito-core", version = "5.12.0" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
graalvm-buildtools-native = { id = "org.graalvm.buildtools.native", version.ref = "graalvm-buildtools-native" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
license = { id = "com.github.hierynomus.license", version.ref = "license" }
 